name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  foundry-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Install foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1

      - name: Run forge tests
        working-directory: packages/foundry
        run: forge test -vvv

      - name: Generate gas snapshot
        working-directory: packages/foundry
        run: forge snapshot

      - name: Fetch base branch gas snapshot
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          git show origin/${{ github.base_ref }}:packages/foundry/.gas-snapshot > /tmp/base-gas-snapshot 2>/dev/null || true

      - name: Compare gas snapshot
        if: github.event_name == 'pull_request'
        working-directory: packages/foundry
        run: |
          if [ -s /tmp/base-gas-snapshot ]; then
            forge snapshot --diff /tmp/base-gas-snapshot > /tmp/gas-diff.txt 2>&1 || true
            echo "GAS_DIFF<<EOF" >> "$GITHUB_ENV"
            cat /tmp/gas-diff.txt >> "$GITHUB_ENV"
            echo "EOF" >> "$GITHUB_ENV"
          else
            echo "GAS_DIFF=No .gas-snapshot found on base branch." >> "$GITHUB_ENV"
          fi

      - name: Post gas diff to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const diff = process.env.GAS_DIFF;
            if (!diff || diff === 'No committed .gas-snapshot to compare against.') {
              console.log('No gas snapshot to compare against, skipping comment.');
              return;
            }
            const body = `### Gas Snapshot Diff\n\n\`\`\`\n${diff}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith('### Gas Snapshot Diff'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload gas snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot
          path: packages/foundry/.gas-snapshot

      - name: Run forge coverage
        working-directory: packages/foundry
        run: forge coverage

      - name: Generate LCOV report
        working-directory: packages/foundry
        run: forge coverage --report lcov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: lcov-report
          path: packages/foundry/lcov.info

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/foundry/lcov.info

  nextjs-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run nextjs tests
        run: yarn next:test

  nextjs-e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paypink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/paypink_test
      NEXTAUTH_SECRET: e2e-test-secret-at-least-32-characters
      NEXTAUTH_URL: http://localhost:3000
      SERVER_WALLET_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"

    steps:
      - name: Checkout
        uses: actions/checkout@master
        with:
          submodules: recursive

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: lts/*
          cache: yarn

      - name: Install foundry-toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.5.1

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install E2E dependencies
        working-directory: packages/nextjs/e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: packages/nextjs/e2e
        run: npx playwright install chromium --with-deps

      - name: Start Anvil and deploy contracts
        run: |
          yarn chain > /tmp/anvil.log 2>&1 &
          for i in $(seq 1 30); do
            curl -s -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"net_version","params":[],"id":1}' \
              http://127.0.0.1:8545 > /dev/null 2>&1 && break
            sleep 1
          done
          curl -s -X POST -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","method":"net_version","params":[],"id":1}' \
            http://127.0.0.1:8545 > /dev/null 2>&1 || { echo "Anvil failed to start"; cat /tmp/anvil.log; exit 1; }
          yarn deploy

      - name: Apply database schema
        working-directory: packages/nextjs
        run: npx drizzle-kit push --force

      - name: Start Next.js dev server
        working-directory: packages/nextjs
        run: |
          yarn dev > /tmp/nextjs.log 2>&1 &
          for i in $(seq 1 60); do
            curl -s http://localhost:3000 > /dev/null 2>&1 && break
            sleep 2
          done
          curl -s http://localhost:3000 > /dev/null 2>&1 || { echo "Next.js failed to start"; cat /tmp/nextjs.log; exit 1; }

      - name: Warm up Next.js routes
        run: |
          # Pre-compile key routes so on-demand compilation doesn't stall E2E tests
          curl -s http://localhost:3000/create > /dev/null 2>&1 || true
          curl -s http://localhost:3000/articles > /dev/null 2>&1 || true
          curl -s http://localhost:3000/articles/warmup > /dev/null 2>&1 || true
          curl -s http://localhost:3000/api/articles/warmup > /dev/null 2>&1 || true

      - name: Run E2E tests
        working-directory: packages/nextjs/e2e
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/nextjs/e2e/test-report/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-test-results
          path: packages/nextjs/e2e/test-results/
          retention-days: 7
